# NOTE: Password is read from .env file (ELASTIC_PASSWORD variable)
# Create .env with: ./scripts/setup_credentials.sh --sync-docker
# Default password if .env not present: changeme

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.25
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u elastic:$${ELASTIC_PASSWORD:-changeme} http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  # Setup service - runs once to configure kibana_system user
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.25
    container_name: setup
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
    command: >
      bash -c '
        echo "Setting up kibana_system user password..."
        until curl -s -u elastic:$${ELASTIC_PASSWORD} http://elasticsearch:9200/_cluster/health | grep -q "green\|yellow"; do
          echo "Waiting for Elasticsearch..."
          sleep 5
        done
        
        # Set kibana_system password to same as elastic password
        curl -s -X POST -u elastic:$${ELASTIC_PASSWORD} \
          -H "Content-Type: application/json" \
          http://elasticsearch:9200/_security/user/kibana_system/_password \
          -d "{\"password\": \"$${ELASTIC_PASSWORD}\"}"
        
        echo ""
        echo "Setup complete!"
      '
    restart: "no"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.25
    container_name: kibana
    ports:
      - "127.0.0.1:5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY}
      - XPACK_SECURITY_ENCRYPTIONKEY=${KIBANA_SECURITY_KEY}
      - XPACK_REPORTING_ENCRYPTIONKEY=${KIBANA_REPORTING_KEY}
    depends_on:
      elasticsearch:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  splunk:
    image: splunk/splunk:9.4
    container_name: splunk
    platform: linux/amd64
    profiles:
      - splunk
    environment:
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_LICENSE_URI=Free
      - SPLUNK_PASSWORD=${SPLUNK_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8088:8088"
    volumes:
      - splunk_data:/opt/splunk/var
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/services/server/info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: opensearch
    profiles:
      - opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9201:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: clickhouse
    profiles:
      - clickhouse
    environment:
      # passwordless `default` from the host too (replay_capture.py, queries); the port is bound to 127.0.0.1 only
      - CLICKHOUSE_SKIP_USER_SETUP=1
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 10

volumes:
  es_data:
    driver: local
  splunk_data:
    driver: local
  opensearch_data:
    driver: local
  clickhouse_data:
    driver: local
