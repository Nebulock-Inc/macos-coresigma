title: macOS ULS TCC Access Denied
id: 86ad3b68-a4dd-40c5-9b6a-0c4e48a24878
status: experimental
description: Detect tccd denials indicating apps denied access to protected categories.
author: Eric Brown - Nebulock, Inc.
date: 2025-10-29
logsource:
  product: macos
  service: unifiedlog
  category: tcc
level: medium
detection:
  # a denial and the service it names, not every line that mentions a kTCCService
  selection_denied:
    message|contains: Denied
  selection_service:
    message|contains: kTCCService
  condition: selection_denied and selection_service
falsepositives:
- chatty apps requesting protected resources frequently
modified: 2026-11-11
custom:
  coresigma:
    status: not-verified
    verdict:
      elastic-eql: noisy
      elastic-esql: noisy
      opensearch: noisy
      splunk: noisy
      clickhouse: noisy
      logscale: fails
      kusto: fails
      defend: fails
      jamf-protect: not-verified
