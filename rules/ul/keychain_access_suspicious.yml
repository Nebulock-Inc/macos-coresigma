title: macOS Suspicious Keychain Access
id: 88fbd60c-cf76-4783-88b6-d541268bc269
status: experimental
description: |
  Detects suspicious access to the macOS Keychain, which stores passwords,
  certificates, and encryption keys. Attackers may attempt to dump credentials
  or access stored secrets.
references:
  - https://attack.mitre.org/techniques/T1555/001/
  - https://www.sentinelone.com/blog/macos-keychain-extraction/
author: Eric Brown - Nebulock, Inc.
date: 2025-01-22
modified: 2026-11-11
logsource:
  product: macos
  service: unifiedlog
  category: securityd
detection:
  selection_keychain:
    message|contains:
      - 'keychain'
      - 'SecKeychainItemCopyContent'
      - 'SecKeychainFindGenericPassword'
      - 'SecKeychainFindInternetPassword'
      - 'security find-generic-password'
      - 'security find-internet-password'
      - 'security dump-keychain'
  selection_suspicious:
    message|contains:
      - 'denied'
      - 'unauthorized'
      - 'failed'
      - 'dump'
      - 'export'
  condition: selection_keychain and selection_suspicious
falsepositives:
  - Legitimate password manager applications
  - System services accessing credentials
  - SSH key access
level: high
tags:
  - attack.credential-access
  - attack.t1555.001
custom:
  coresigma:
    status: not-verified
    verdict:
      elastic-eql: noisy
      elastic-esql: noisy
      opensearch: noisy
      splunk: noisy
      clickhouse: noisy
      logscale: fails
      kusto: fails
      defend: fails
      jamf-protect: not-verified
