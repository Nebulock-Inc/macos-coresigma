title: macOS System Integrity Protection Modification Attempt
id: efc5235a-2413-4c33-96dd-3c85d810cc07
status: experimental
description: |
  Detects attempts to modify or bypass System Integrity Protection (SIP),
  which protects critical system files and processes. Disabling SIP is a
  common step in rootkit installation and advanced malware attacks.
references:
  - https://attack.mitre.org/techniques/T1553/006/
  - https://support.apple.com/en-us/HT204899
author: Eric Brown - Nebulock, Inc.
date: 2025-01-22
modified: 2026-11-11
logsource:
  product: macos
  service: unifiedlog
  category: gatekeeper
detection:
  selection_sip:
    message|contains:
      - 'System Integrity Protection'
      - 'SIP'
      - 'csrutil'
      - 'rootless'
      - 'protected'
  selection_modification:
    message|contains:
      - 'disable'
      - 'disabled'
      - 'bypass'
      - 'violation'
      - 'denied'
      - 'blocked'
  condition: selection_sip and selection_modification
falsepositives:
  - Security researchers in controlled environments
  - System administrators performing legitimate tasks
level: critical
tags:
  - attack.defense-impairment
  - attack.t1553.006
custom:
  coresigma:
    status: not-verified
    verdict:
      elastic-eql: silent
      elastic-esql: silent
      opensearch: silent
      splunk: silent
      clickhouse: silent
      logscale: fails
      kusto: fails
      defend: fails
      jamf-protect: not-verified
