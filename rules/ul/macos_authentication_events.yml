title: macOS Authentication Events
id: 3697a253-44ea-4276-b805-f07935c82538
status: experimental
description: 'Detects authentication-related events from the macOS authorization subsystem.

  Monitors for login attempts, credential validation, and authorization requests

  which may indicate initial access attempts or compromised credentials.

  '
author: Eric Brown - Nebulock, Inc.
date: 2025-10-31
modified: 2026-11-11
references:
- https://attack.mitre.org/techniques/T1078/
- https://developer.apple.com/documentation/os/logging
logsource:
  product: macos
  service: unifiedlog
  category: authorization
detection:
  selection_keywords:
    message|contains:
    - authentication
    - login
    - credential
    - authorize
  condition: selection_keywords
falsepositives:
- Normal user authentication and login activity
- System services performing authorized operations
- Legitimate administrative tasks
fields:
- subsystem
- category
- processImagePath
- message
- messageType
tags:
- attack.initial-access
- attack.t1078
level: low
custom:
  coresigma:
    status: not-verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: fires
      logscale: fails
      kusto: fails
      defend: fails
      jamf-protect: not-verified
