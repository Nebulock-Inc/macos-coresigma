title: macOS UL Sudo Command Execution
id: 2f4dc432-e8f0-4c61-9f01-05195a9fd73a
status: experimental
description: Detects sudo command execution which could indicate privilege escalation or unauthorized access. Hosts whose sudoers sets `Defaults !log_allowed` don't log successful commands (COMMAND=), so there it sees only denials.
author: Eric Brown - Nebulock, Inc.
date: 2025-01-15
modified: 2026-11-11
logsource:
    product: macos
    service: unifiedlog
    category: sudo
detection:
    selection:
        message|contains:
            - 'TTY='
            - 'USER='
    condition: selection
falsepositives:
    - Legitimate administrative tasks
    - System maintenance operations
level: low
tags:
    - attack.privilege-escalation
custom:
  coresigma:
    status: not-verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: fires
      logscale: fails
      kusto: fails
      defend: fails
      jamf-protect: not-verified
