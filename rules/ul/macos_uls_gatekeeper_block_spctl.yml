title: macOS ULS Gatekeeper Block (spctl)
id: 396eaead-b849-4099-b19c-2cffb07fcc73
status: experimental
description: Detect Gatekeeper blocks logged by spctl or related subsystems.
author: Eric Brown - Nebulock, Inc.
date: 2025-10-29
logsource:
  product: macos
  service: unifiedlog
  category: gatekeeper
level: high
detection:
  selection:
    message|contains:
    - rejected
    - assessment failed
  condition: selection
falsepositives:
- unsigned internal tools during development
modified: 2026-11-11
custom:
  coresigma:
    status: not-verified
    verdict:
      elastic-eql: silent
      elastic-esql: silent
      opensearch: silent
      splunk: silent
      clickhouse: silent
      logscale: fails
      kusto: fails
      defend: fails
      jamf-protect: not-verified
