title: macOS MDM Profile Manipulation
id: 033bca8a-e5a9-4f5f-b015-31cb2cabce76
status: experimental
description: |
  Detects manipulation of MDM (Mobile Device Management) configuration profiles.
  Attackers may attempt to install malicious profiles or remove security profiles
  to weaken system defenses.
references:
  - https://attack.mitre.org/techniques/T1685/
  - https://support.apple.com/guide/deployment/intro-to-mdm-profiles-depc0aadd3fe/web
author: Eric Brown - Nebulock, Inc.
date: 2025-01-22
modified: 2026-11-11
logsource:
  product: macos
  service: unifiedlog
  category: mdm
detection:
  selection_operations:
    message|contains:
      - 'profile'
      - 'installed'
      - 'removed'
      - 'configuration'
      - 'payload'
  selection_suspicious:
    message|contains:
      - 'unsigned'
      - 'untrusted'
      - 'manual install'
      - 'user install'
  condition: selection_operations and selection_suspicious
falsepositives:
  - Legitimate MDM enrollment
  - IT administrator profile deployment
level: high
tags:
  - attack.defense-impairment
  - attack.t1685
custom:
  coresigma:
    status: not-verified
    verdict:
      elastic-eql: silent
      elastic-esql: silent
      opensearch: silent
      splunk: silent
      clickhouse: silent
      logscale: fails
      kusto: fails
      defend: fails
      jamf-protect: not-verified
