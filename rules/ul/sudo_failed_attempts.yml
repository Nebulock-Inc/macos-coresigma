title: macOS Multiple Failed Sudo Attempts
id: dbc5f4c6-c281-4662-8eb2-9addcecaa40d
status: experimental
description: |
  Detects multiple failed sudo authentication attempts, which may indicate
  password guessing, brute force attempts, or an attacker trying to escalate
  privileges using compromised credentials.
references:
  - https://attack.mitre.org/techniques/T1548/003/
  - https://attack.mitre.org/techniques/T1110/
author: Eric Brown - Nebulock, Inc.
date: 2025-01-22
modified: 2026-11-11
logsource:
  product: macos
  service: unifiedlog
  category: sudo
detection:
  selection_failed:
    message|contains:
      - 'authentication failed'
      - 'incorrect password attempt'
      - '3 incorrect password attempts'
      - 'NOT in sudoers'
      - 'user NOT authorized'
      - 'sorry, try again'
  condition: selection_failed
falsepositives:
  - Users forgetting their password
  - Mistyped passwords
level: high
tags:
  - attack.privilege-escalation
  - attack.t1548.003
  - attack.credential-access
  - attack.t1110
custom:
  coresigma:
    status: verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: fires
      logscale: fails
      kusto: fails
      defend: fails
      jamf-protect: not-verified
