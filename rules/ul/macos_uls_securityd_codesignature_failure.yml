title: macOS ULS securityd CodeSignature Failure
id: e1c4dc0e-3a75-4f58-8e8f-5d4a9f9a1b2c
status: experimental
description: Detect logs from securityd indicating code signature failures which might
  reflect tampering.
author: Eric Brown - Nebulock, Inc.
date: 2025-10-29
logsource:
  product: macos
  service: unifiedlog
  category: securityd
level: medium
detection:
  selection:
    message|contains:
    - code signature invalid
    - rejecting
    - '-67061'  # errSecCSSignatureFailed: invalid signature (code or signature have been modified)
  condition: selection
falsepositives:
- developer builds or ad-hoc signing
modified: 2026-11-13
custom:
  coresigma:
    status: verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: fires
      logscale: fails
      kusto: fails
      defend: fails
      jamf-protect: not-verified
