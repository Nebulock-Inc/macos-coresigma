title: Firewall Disabled
id: 29e86bb3-3940-42e7-8da9-0ea4d47f20df
status: experimental
description: Detects disabling of the macOS firewall which exposes the system to network
  attacks
references:
- https://attack.mitre.org/techniques/T1686/
author: Eric Brown - Nebulock, Inc.
date: 2025-10-29
tags:
- attack.defense-impairment
- attack.t1686
logsource:
  product: macos
  service: unifiedlog
  category: firewall
detection:
  selection:
    message|contains:
    - firewall disabled
    - firewall stopped
    - global state disabled
    - turning firewall off  # macOS 26: socketfilterfw's FilterMessageHandler, as the firewall goes off
  condition: selection
falsepositives:
- Network troubleshooting
level: high
modified: 2026-11-13
custom:
  coresigma:
    status: verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: fires
      logscale: fails
      kusto: fails
      defend: fails
      jamf-protect: not-verified
