title: macOS LaunchAgent/LaunchDaemon Persistence
id: dab925a3-8900-441b-bb61-8601c2e164c9
status: experimental
description: |
  Detects creation or modification of LaunchAgent or LaunchDaemon plist files,
  which are commonly used for persistence on macOS. Attackers may create or modify
  these to execute malicious code at login or system startup.
  `log stream` doesn't deliver /sbin/launchd lines, so a live stream collector never feeds this
  rule; it fires on `log show` output (archives, replays).
references:
  - https://attack.mitre.org/techniques/T1543/001/
  - https://www.sentinelone.com/blog/how-malware-persists-on-macos/
author: Eric Brown - Nebulock, Inc.
date: 2025-01-22
modified: 2026-11-11
logsource:
  product: macos
  service: unifiedlog
  category: launchd
detection:
  selection_persistence:
    message|contains:
      - 'LaunchAgent'
      - 'LaunchDaemon'
      - 'loaded'
      - 'submitted'
      - 'bootstrap'
  selection_paths:
    message|contains:
      - '/Library/LaunchAgents'
      - '/Library/LaunchDaemons'
      - '~/Library/LaunchAgents'
      - '/System/Library/LaunchAgents'
      - '/System/Library/LaunchDaemons'
  filter_system:
    message|contains:
      - 'com.apple.'
  # an Apple-named plist outside the sealed /System/Library is not exempt
  selection_apple_named_plist:
    message|contains:
      - '/Library/LaunchAgents/com.apple.'
      - '/Library/LaunchDaemons/com.apple.'
  filter_sealed_system_plist:
    message|contains:
      - '/System/Library/LaunchAgents/com.apple.'
      - '/System/Library/LaunchDaemons/com.apple.'
  condition: (selection_persistence or selection_paths) and (not filter_system or (selection_apple_named_plist and not filter_sealed_system_plist))
falsepositives:
  - Legitimate software installation
  - System updates
  - Enterprise management tools
level: medium
tags:
  - attack.persistence
  - attack.t1543.001
custom:
  coresigma:
    status: not-verified
    verdict:
      elastic-eql: silent
      elastic-esql: silent
      opensearch: silent
      splunk: silent
      clickhouse: silent
      logscale: fails
      kusto: fails
      defend: fails
      jamf-protect: not-verified
