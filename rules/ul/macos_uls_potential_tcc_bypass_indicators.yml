title: macOS ULS Potential TCC Bypass Indicators
id: d5a8a3c7-58a6-4a8a-9e07-4ad7a0e6ec0a
status: experimental
description: Detect logs referencing TCC errors or denials that might indicate attempts
  to bypass privacy controls.
author: Eric Brown - Nebulock, Inc.
date: 2025-10-29
logsource:
  product: macos
  service: unifiedlog
  category: tcc
level: medium
detection:
  selection:
    # TCC and kTCCService only scoped the rule to TCC logs; category: tcc does that now
    message|contains:
    - access denied
    - prompting for access
  condition: selection
falsepositives:
- noisy applications frequently requesting sensitive entitlements
modified: 2026-11-11
custom:
  coresigma:
    status: not-verified
    verdict:
      elastic-eql: silent
      elastic-esql: silent
      opensearch: silent
      splunk: silent
      clickhouse: silent
      logscale: fails
      kusto: fails
      defend: fails
      jamf-protect: not-verified
