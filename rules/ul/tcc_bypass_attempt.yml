title: macOS TCC Privacy Bypass Attempt
id: 2d942254-d897-4724-9833-1d6570711ecc
status: experimental
description: |
  Detects potential attempts to bypass macOS Transparency, Consent, and Control (TCC)
  privacy protections. TCC protects sensitive resources like Camera, Microphone, 
  Screen Recording, and Full Disk Access.
references:
  - https://attack.mitre.org/techniques/T1548/
  - https://developer.apple.com/documentation/security/tcc
  - https://objective-see.org/blog/blog_0x6C.html
author: Eric Brown - Nebulock, Inc.
date: 2025-01-22
modified: 2026-11-11
logsource:
  product: macos
  service: unifiedlog
  category: tcc
detection:
  selection_bypass_indicators:
    message|contains:
      - 'access denied'
      - 'Denied'
      - 'prompting for access'
      - 'kTCCServiceSystemPolicyAllFiles'
      - 'kTCCServiceScreenCapture'
      - 'kTCCServiceMicrophone'
      - 'kTCCServiceCamera'
      - 'kTCCServiceAccessibility'
      - 'kTCCServicePostEvent'
  filter_normal_prompts:
    message|contains:
      - 'User approved'
      - 'granted'
  condition: selection_bypass_indicators and not filter_normal_prompts
falsepositives:
  - Legitimate applications requesting sensitive permissions
  - First-time application launches requesting access
level: high
tags:
  - attack.privilege-escalation
  - attack.t1548
custom:
  coresigma:
    status: not-verified
    verdict:
      elastic-eql: noisy
      elastic-esql: noisy
      opensearch: noisy
      splunk: noisy
      clickhouse: noisy
      logscale: fails
      kusto: fails
      defend: fails
      jamf-protect: not-verified
