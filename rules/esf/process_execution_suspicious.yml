title: macOS ESF Suspicious Process Execution
id: 25a227ce-e25a-4954-9063-84b6837a5a05
status: experimental
description: Detects suspicious process execution patterns commonly used in malware and attacks
author: Eric Brown - Nebulock, Inc.
date: 2025-01-15
modified: 2026-11-11
logsource:
    product: macos
    category: process_creation
detection:
    selection:
        Image|contains:
            - '/tmp/'
            - '/var/tmp/'
            - '/var/folders/'
            - '/dev/shm/'
        CommandLine|contains:
            - 'curl'
            - 'wget'
            - 'bash -c'
            - 'python -c'
            - '/bin/sh'
    condition: selection
falsepositives:
    - Legitimate system scripts and automation tools
level: medium
tags:
    - attack.execution
    - attack.command-and-control
custom:
  coresigma:
    status: verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: fires
      logscale: fires
      kusto: converts
      defend: converts
      jamf-protect: not-verified
