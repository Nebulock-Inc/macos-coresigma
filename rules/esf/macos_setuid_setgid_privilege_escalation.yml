title: macOS Setuid/Setgid Privilege Escalation
id: 0f3109b3-d7e5-4c8a-a082-d8f0fa7be7a1
status: experimental
description: 'Detects setuid or setgid operations that transition to root (UID 0) from
  non-root users, which may indicate privilege escalation attempts.

  These syscalls allow processes to change their effective user ID or group ID, often

  used by attackers to gain elevated privileges. High-fidelity detection focuses on

  transitions to root from non-privileged users.

  '
author: Eric Brown - Nebulock, Inc.
date: 2025-10-31
modified: 2026-11-11
references:
- https://attack.mitre.org/techniques/T1548/001/
- https://attack.mitre.org/techniques/T1068/
logsource:
  product: macos
  category: privilege_change
detection:
  selection_setuid_to_root:
    TargetUserId: 0
  selection_setgid_to_wheel:
    TargetGroupId: 0
  selection_root_source:
    UserId: 0
  condition: (selection_setuid_to_root or selection_setgid_to_wheel) and not selection_root_source
falsepositives:
- Legitimate system utilities and services
- Software installation and updates
- Authorized administrative tools
fields:
- ProcessId
- User
- UserId
- TargetUserId
- TargetGroupId
tags:
- attack.privilege-escalation
- attack.t1548.001
- attack.t1068
level: high
custom:
  coresigma:
    status: not-verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: fires
      logscale: fails
      kusto: fails
      defend: converts
      jamf-protect: not-verified
