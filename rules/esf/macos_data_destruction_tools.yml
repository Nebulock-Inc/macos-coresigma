title: macOS Data Destruction Tools
id: d17e46cc-8609-4896-95f5-5721382d5ffe
status: experimental
description: 'Detects execution of data destruction tools (rm, shred, srm, dd) with
  aggressive

  or recursive options which may indicate data destruction for impact or anti-forensics.

  Adversaries use these tools to destroy data, render systems inoperable, or cover
  tracks.

  '
author: Eric Brown - Nebulock, Inc.
date: 2025-10-31
modified: 2026-11-11
references:
- https://attack.mitre.org/techniques/T1485/
- https://attack.mitre.org/techniques/T1070/004/
logsource:
  product: macos
  category: process_creation
detection:
  selection_process:
    Image|endswith:
    - /rm
    - /shred
    - /srm
    - /dd
  selection_dangerous:
    CommandLine|contains:
    - -rf
    - --recursive
    - if=/dev/zero
    - if=/dev/random
    - of=/dev/
  selection_dangerous_recursive:
    # -R but not -r. A regex is case-sensitive on most backends; |cased doesn't convert on Lucene, ES|QL or Splunk
    CommandLine|re: '.* -R.*'
  filter_dev_null:
    CommandLine|contains: of=/dev/null
  condition: selection_process and (selection_dangerous or selection_dangerous_recursive) and not filter_dev_null
falsepositives:
- System maintenance and cleanup operations
- Software uninstallation procedures
- Legitimate disk management tasks
- Development and testing workflows
fields:
- Image
- CommandLine
- ProcessId
- ParentProcessId
- User
tags:
- attack.impact
- attack.t1485
- attack.stealth
- attack.t1070.004
level: high
custom:
  coresigma:
    status: not-verified
    verdict:
      elastic-eql: noisy
      elastic-esql: noisy
      opensearch: noisy
      splunk: noisy
      clickhouse: noisy
      logscale: fires
      kusto: converts
      defend: converts
      jamf-protect: not-verified
