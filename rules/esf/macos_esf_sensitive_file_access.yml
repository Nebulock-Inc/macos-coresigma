title: macOS ESF Sensitive File Access
id: 3c9e1ec5-6f6c-4c9d-bb3a-1b7cf0b9a1df
status: experimental
description: Detect access to sensitive system files via ESF OPEN notifications. More suspicious when non-root users access these files.
author: Eric Brown - Nebulock, Inc.
date: 2025-10-29
logsource:
  product: macos
  category: file_access
level: high
detection:
  selection_path:
    TargetFilename|startswith:
    - /etc/hosts
    - /etc/sudoers
    - /private/etc/hosts
    - /private/etc/sudoers
  selection_tcc_db:
    # system and per-user TCC databases
    TargetFilename|endswith: /Library/Application Support/com.apple.TCC/TCC.db
  selection_root:
    UserId: 0
  filter_tccd:
    SigningID: com.apple.tccd
  condition: (selection_path or selection_tcc_db) and not selection_root and not filter_tccd
falsepositives:
- legitimate administrative tasks (e.g., configuration management)
- root user administrative access
tags:
- attack.discovery
modified: 2026-11-11
custom:
  coresigma:
    status: not-verified
    verdict:
      elastic-eql: noisy
      elastic-esql: noisy
      opensearch: noisy
      splunk: noisy
      clickhouse: noisy
      logscale: fails
      kusto: fails
      defend: converts
      jamf-protect: not-verified
