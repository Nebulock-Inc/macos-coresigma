title: Suspicious Kernel Extension Names
id: 8aa8d6c9-61fc-46ac-b83f-f055cb640186
status: experimental
description: Detects kernel extensions with suspicious or generic names often used
  by rootkits and malware
references:
- https://attack.mitre.org/techniques/T1014/
- https://www.sentinelone.com/labs/20-common-tools-techniques-used-by-macos-threat-actors-malware/
author: Eric Brown - Nebulock, Inc.
date: 2025-10-29
tags:
- attack.stealth
- attack.t1014
logsource:
  product: macos
  category: driver_load
detection:
  selection:
    KextIdentifier|contains:
    - rootkit
    - backdoor
    - keylogger
    - stealth
    - hidden
    - fake
    - com.test.
    - com.temp.
  condition: selection
falsepositives:
- Development and testing kexts
level: high
modified: 2026-11-11
custom:
  coresigma:
    status: not-verified
    verdict:
      elastic-eql: silent
      elastic-esql: silent
      opensearch: silent
      splunk: silent
      clickhouse: silent
      logscale: fails
      kusto: fails
      defend: converts
      jamf-protect: not-verified
