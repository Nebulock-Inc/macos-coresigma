title: macOS ESF Deletion In Sensitive Directories
id: 52b5612d-3c9e-4a4a-9b7a-1b6f94b6a0aa
status: experimental
description: Detect unlink (delete) operations in sensitive directories such as LaunchAgents/Daemons
  or system configs.
author: Eric Brown - Nebulock, Inc.
date: 2025-10-29
logsource:
  product: macos
  category: file_delete
level: medium
detection:
  selection_path:
    TargetFilename|startswith:
    - /Library/LaunchDaemons/
    - /Library/LaunchAgents/
    - /System/Library/LaunchDaemons/
    - /etc/
    - /private/etc/
  condition: selection_path
falsepositives:
- legitimate maintenance or upgrades
modified: 2026-11-11
custom:
  coresigma:
    status: verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: fires
      logscale: fails
      kusto: converts
      defend: converts
      jamf-protect: not-verified
