title: macOS Service Disruption Activity
id: e673e584-70d1-4b1e-9bdf-48f7eb0064d9
status: experimental
description: 'Detects execution of service control tools (launchctl, killall, pkill)
  with

  parameters targeting system services or multiple processes. May indicate service

  disruption for impact or denial of service attacks.

  '
author: Eric Brown - Nebulock, Inc.
date: 2025-10-31
modified: 2026-11-11
references:
- https://attack.mitre.org/techniques/T1489/
logsource:
  product: macos
  category: process_creation
detection:
  selection_launchctl:
    Image|endswith: /launchctl
    CommandLine|contains:
    - unload
    - bootout
    - remove
    - disable
    - stop
  selection_kill:
    Image|endswith:
    - /killall
    - /pkill
    CommandLine|contains:
    - '-9'
    - SIGKILL
    - -KILL
  selection_root:
    UserId: 0
  condition: (selection_launchctl or selection_kill) and not selection_root
falsepositives:
- System administration and service management
- Software updates requiring service restarts
- Legitimate process termination
- Troubleshooting and maintenance activities
- Root user administrative actions
fields:
- Image
- CommandLine
- ProcessId
- ParentProcessId
- User
tags:
- attack.impact
- attack.t1489
level: medium
custom:
  coresigma:
    status: verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: fires
      logscale: fails
      kusto: fails
      defend: converts
      jamf-protect: not-verified
