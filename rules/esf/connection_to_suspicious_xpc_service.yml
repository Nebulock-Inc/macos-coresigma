title: Connection to Suspicious XPC Service
id: 76268965-b31d-4aee-8098-12b72f696481
status: experimental
description: Detects connections to XPC services with suspicious or generic names
  that may indicate malicious IPC
references:
- https://attack.mitre.org/techniques/T1559/
- https://wojciechregula.blog/post/learn-xpc-exploitation-part-1-broken-cryptography/
author: Eric Brown - Nebulock, Inc.
date: 2025-10-29
tags:
- attack.execution
- attack.t1559
logsource:
  product: macos
  category: xpc_connection
detection:
  selection:
    XpcServiceName|contains:
    - backdoor
    - rootkit
    - shell
    - payload
    - exploit
    - .temp.
    - .test.
  condition: selection
falsepositives:
- Development and testing services
level: high
modified: 2026-11-11
custom:
  coresigma:
    status: verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: fires
      logscale: fails
      kusto: fails
      defend: converts
      jamf-protect: not-verified
