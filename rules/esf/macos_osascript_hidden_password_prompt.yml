title: macOS ESF Osascript Hidden Password Prompt
id: e353fa5d-2800-4fdc-a30c-c537d16b6021
status: experimental
description: Detect osascript displaying a dialog with a hidden answer field, the fake
  password prompt used by infostealers such as AMOS/Atomic Stealer to capture the
  user's login password. "hidden answer" (AppleScript) and hiddenAnswer (JavaScript for
  Automation's displayDialog option) only occur as display dialog parameters, so they are matched
  alone. It misses extra whitespace between the two AppleScript words ("hidden  answer", which
  AppleScript compiles), a computed or escaped key in JXA (["hidden" + "Answer"]), and a script fed
  to osascript on stdin or from a file, which doesn't show on the command line.
references:
- https://attack.mitre.org/techniques/T1056/002/
author: Sydney Marrone - THOR Collective
date: 2026-11-06
modified: 2026-11-12
logsource:
  product: macos
  category: process_creation
level: high
detection:
  selection_process:
    Image|endswith: /osascript
  selection_signed:
    SigningID: com.apple.osascript
  selection_cmd:
    CommandLine|contains:
    - hidden answer
    - hiddenAnswer
  condition: (selection_process or selection_signed) and selection_cmd
falsepositives:
- internal admin scripts that prompt for credentials via AppleScript
- MDM scripts that ask for the user's password to enable FileVault or grant a secure token
- a dialog that turns the hidden field off (without hidden answer, hiddenAnswer false)
tags:
- attack.credential-access
- attack.collection
- attack.t1056.002
- attack.execution
- attack.t1059.002
custom:
  coresigma:
    status: verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: fires
      logscale: fails
      kusto: fails
      defend: converts
      jamf-protect: not-verified
