title: macOS Gatekeeper User Override
id: 61a63a62-a6c7-432c-af13-01a28270790e
status: experimental
description: 'Detects Gatekeeper user override events where users explicitly allow
  execution

  of unsigned or unnotarized applications. While sometimes legitimate, this can

  indicate social engineering attacks or user attempts to bypass security controls.

  Available on macOS 15+.

  '
author: Eric Brown - Nebulock, Inc.
date: 2025-10-31
modified: 2026-11-11
references:
- https://attack.mitre.org/techniques/T1553/001/
- https://attack.mitre.org/techniques/T1204/
logsource:
  product: macos
  category: gatekeeper_override
detection:
  selection:
    # every ESF event has an acting process: the category does the scoping
    Image|startswith: /
  condition: selection
falsepositives:
- Users intentionally running trusted unsigned software
- Development and testing activities
- Legacy applications without notarization
fields:
- Image
- User
tags:
- attack.defense-impairment
- attack.t1553.001
- attack.execution
- attack.t1204
level: high
custom:
  coresigma:
    status: verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: fires
      logscale: fails
      kusto: fails
      defend: converts
      jamf-protect: not-verified
