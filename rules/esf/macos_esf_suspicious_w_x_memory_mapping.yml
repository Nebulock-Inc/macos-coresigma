title: macOS ESF Suspicious W+X Memory Mapping
id: 1d3f5c4b-3c5b-4a2a-bf6d-0d1a9e7f2d77
status: experimental
description: Detect processes creating writable and executable memory mappings which
  can indicate shellcode/JIT usage.
author: Eric Brown - Nebulock, Inc.
date: 2025-10-29
logsource:
  product: macos
  category: memory_protection
level: high
detection:
  selection_flags:
    # protection is the raw bitmask: PROT_WRITE (2) | PROT_EXEC (4), with or without PROT_READ (1)
    MemoryProtection:
    - 6
    - 7
  condition: selection_flags
falsepositives:
- legitimate JIT engines (e.g., browsers, VMs)
tags:
- attack.stealth
modified: 2026-11-11
custom:
  coresigma:
    status: not-verified
    verdict:
      elastic-eql: noisy
      elastic-esql: noisy
      opensearch: noisy
      splunk: noisy
      clickhouse: noisy
      logscale: fails
      kusto: fails
      defend: converts
      jamf-protect: not-verified
