title: macOS User Account Manipulation
id: ae07466e-5964-418d-9f2f-dcaf405ac2fc
status: experimental
description: 'Detects creation, deletion, or modification of user accounts via Open
  Directory.

  Attackers often create backdoor accounts for persistence or modify existing

  accounts to maintain access. Monitor for unexpected user management activities.

  '
author: Eric Brown - Nebulock, Inc.
date: 2025-10-31
modified: 2026-11-11
references:
- https://attack.mitre.org/techniques/T1136/001/
- https://attack.mitre.org/techniques/T1098/
logsource:
  product: macos
  category: user_account_change
detection:
  selection:
    # every ESF event has an acting process: the category does the scoping
    Image|startswith: /
  condition: selection
falsepositives:
- IT administration and user provisioning
- MDM user management
- User self-service password changes
- Automated user lifecycle management
fields:
- ProcessId
- User
tags:
- attack.persistence
- attack.t1136.001
- attack.t1098
level: high
custom:
  coresigma:
    status: verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: silent
      logscale: fails
      kusto: fails
      defend: converts
      jamf-protect: not-verified
