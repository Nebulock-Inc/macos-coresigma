title: SIGKILL Sent to Security Tools
id: 3028231e-acae-4e0b-88a6-3044502c7478
status: experimental
description: Detects SIGKILL signals sent to security tools which may indicate defense
  evasion
references:
- https://attack.mitre.org/techniques/T1685/
author: Eric Brown - Nebulock, Inc.
date: 2025-10-29
tags:
- attack.defense-impairment
- attack.t1685
logsource:
  product: macos
  category: process_signal
detection:
  selection:
    SignalNumber: 9
    TargetImage|contains:
    - LittleSnitch
    - BlockBlock
    - KnockKnock
    - OverSight
    - ReiKey
    - Santa
    - /xprotectd
    - /MRT
    - CrowdStrike
    - SentinelOne
  condition: selection
falsepositives:
- System updates
- Legitimate process management
level: high
modified: 2026-11-11
custom:
  coresigma:
    status: verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: fires
      logscale: fails
      kusto: fails
      defend: converts
      jamf-protect: not-verified
