title: XPC Privilege Escalation Attempt
id: 3d9194fd-230e-40ad-9610-6b15c0ba78c9
status: experimental
description: Detects XPC connections from low-privileged processes to high-privileged
  services which may indicate privilege escalation
references:
- https://attack.mitre.org/techniques/T1068/
- https://wojciechregula.blog/post/learn-xpc-exploitation-part-2-say-no-to-the-dump/
author: Eric Brown - Nebulock, Inc.
date: 2025-10-29
tags:
- attack.privilege-escalation
- attack.t1068
logsource:
  product: macos
  category: xpc_connection
detection:
  selection_service:
    XpcServiceName|contains:
    - com.apple.xpc.privileged
    - com.apple.security
    - com.apple.admin
  filter_root:
    UserId: 0
  condition: selection_service and not filter_root
falsepositives:
- System utilities
- Administrative tools
level: medium
modified: 2026-11-11
custom:
  coresigma:
    status: not-verified
    verdict:
      elastic-eql: noisy
      elastic-esql: noisy
      opensearch: noisy
      splunk: noisy
      clickhouse: noisy
      logscale: fails
      kusto: fails
      defend: converts
      jamf-protect: not-verified
