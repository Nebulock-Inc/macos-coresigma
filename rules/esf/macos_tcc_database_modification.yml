title: macOS TCC Database Modification
id: d187fdf7-5c6f-4f23-9694-71d87472407a
status: experimental
description: 'Detects modifications to the TCC (Transparency, Consent, and Control)
  database

  which controls privacy permissions on macOS. Direct TCC database modification

  is a sophisticated evasion technique to bypass privacy protections and grant

  unauthorized access to sensitive resources (camera, microphone, files, etc.).

  This is a critical security event available on macOS 15.4+.

  '
author: Eric Brown - Nebulock, Inc.
date: 2025-10-31
modified: 2026-11-11
references:
- https://attack.mitre.org/techniques/T1548/006/
logsource:
  product: macos
  category: tcc_modification
detection:
  selection:
    # every ESF event has an acting process: the category does the scoping
    Image|startswith: /
  condition: selection
falsepositives:
- System updates and installations
- MDM policy changes
- Legitimate applications requesting permissions
- User-initiated permission changes (rare to see at this level)
fields:
- ProcessId
- Image
- User
- TccService
- TccIdentity
- TccRight
- TccReason
- InstigatorImage
tags:
- attack.privilege-escalation
- attack.t1548.006
level: critical
custom:
  coresigma:
    status: not-verified
    verdict:
      elastic-eql: silent
      elastic-esql: silent
      opensearch: silent
      splunk: silent
      clickhouse: silent
      logscale: fails
      kusto: fails
      defend: converts
      jamf-protect: not-verified
