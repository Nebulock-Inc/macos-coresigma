title: macOS Cloud Storage Access Tools
id: 4a0366e3-01e0-4345-bf41-487b54871df7
status: experimental
description: 'Detects execution of cloud storage CLI tools (aws, gsutil, rclone) which
  may

  indicate exfiltration to cloud storage services. Adversaries use cloud storage

  to exfiltrate data while blending in with legitimate traffic.

  '
author: Eric Brown - Nebulock, Inc.
date: 2025-10-31
modified: 2026-11-11
references:
- https://attack.mitre.org/techniques/T1567/002/
- https://attack.mitre.org/techniques/T1537/
logsource:
  product: macos
  category: process_creation
detection:
  selection_process:
    Image|endswith:
    - /aws
    - /gsutil
    - /rclone
    - /s3cmd
    - /azcopy
  selection_upload:
    CommandLine|contains:
    - s3 cp
    - s3 sync
    - gsutil cp
    - rclone copy
    - rclone sync
    - ' put '  # put as a word: s3cmd put, not --output
    - ' put-object'
    - upload
  condition: selection_process and selection_upload
falsepositives:
- Legitimate cloud backup operations
- DevOps and CI/CD pipelines
- Automated data synchronization
- System administration tasks
fields:
- Image
- CommandLine
- ProcessId
- ParentProcessId
- User
tags:
- attack.exfiltration
- attack.t1567.002
- attack.t1537
level: medium
custom:
  coresigma:
    status: verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: fires
      logscale: fires
      kusto: converts
      defend: converts
      jamf-protect: not-verified
