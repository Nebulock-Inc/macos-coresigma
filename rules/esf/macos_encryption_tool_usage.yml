title: macOS Encryption Tool Usage
id: e7f60a2b-0f79-40d6-b951-d18c4b290906
status: experimental
description: 'Detects execution of encryption tools (openssl, gpg, diskutil) which
  may indicate

  ransomware activity or data encryption for impact. Adversaries encrypt data to

  deny availability and extort victims. Also monitors disk encryption operations.

  '
author: Eric Brown - Nebulock, Inc.
date: 2025-10-31
modified: 2026-11-11
references:
- https://attack.mitre.org/techniques/T1486/
- https://attack.mitre.org/techniques/T1565/001/
logsource:
  product: macos
  category: process_creation
detection:
  selection_process:
    Image|endswith:
    - /openssl
    - /gpg
    - /gpg2
    - /diskutil
  selection_encryption:
    CommandLine|contains:
    - 'enc '
    - encrypt
    - aes
    - --cipher
    - apfs encryptVolume
    - coreStorage convert
  condition: selection_process and selection_encryption
falsepositives:
- Legitimate data encryption for security
- FileVault and disk encryption setup
- Secure file transfer preparations
- Development and testing of encryption features
fields:
- Image
- CommandLine
- ProcessId
- ParentProcessId
- User
tags:
- attack.impact
- attack.t1486
- attack.t1565.001
level: medium
custom:
  coresigma:
    status: verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: fires
      logscale: fires
      kusto: converts
      defend: converts
      jamf-protect: not-verified
