title: Fake Password Prompt or Password Check (Stealer Pattern)
id: 9235b435-c36a-4e5a-9663-ce8861a6265a
name: credential_capture_any
status: experimental
description: |
  Base rule for the paste-to-stealer correlation, matching its credential step: osascript showing a
  dialog with a hidden answer (a fake password prompt; "hidden answer" in AppleScript, hiddenAnswer in
  JavaScript for Automation; the known misses are listed in macos_osascript_hidden_password_prompt.yml)
  or dscl -authonly checking a password. Open
  Directory authentication by a non-system process is left out: the taxonomy has no field for the
  authentication event's instigator.
references:
  - https://unit42.paloaltonetworks.com/atomic-macos-amos-stealer-activity
author: Eric Brown - Nebulock, Inc.
date: 2026-11-11
modified: 2026-11-12
logsource:
  product: macos
  category: process_creation
detection:
  selection_osascript:
    - Image|endswith: /osascript
    - SigningID: com.apple.osascript
  selection_hidden_answer:
    CommandLine|contains:
    - hidden answer
    - hiddenAnswer
  selection_dscl:
    - Image: /usr/bin/dscl
    - SigningID: com.apple.dscl
  selection_authonly:  # dscl's leading dashes are optional: dscl . authonly is the same command
    CommandLine|contains:
    - ' -authonly '
    - ' authonly '
  condition: (selection_osascript and selection_hidden_answer) or (selection_dscl and selection_authonly)
falsepositives:
  - MDM or admin scripts that prompt for or verify the user's password
tags:
  - attack.credential-access
  - attack.t1056.002
level: medium
custom:
  coresigma:
    status: base
    base_of:
      - paste_to_stealer
