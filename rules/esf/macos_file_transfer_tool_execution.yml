title: macOS File Transfer Tool Execution
id: aad51ad2-735f-4dd2-b31b-447eb5987b0a
status: experimental
description: 'Detects execution of file transfer tools (scp, rsync, sftp) which may
  indicate

  lateral movement or data staging for exfiltration. Adversaries often use these

  utilities to move files between compromised systems.

  '
author: Eric Brown - Nebulock, Inc.
date: 2025-10-31
modified: 2026-11-11
references:
- https://attack.mitre.org/techniques/T1021/004/
- https://attack.mitre.org/techniques/T1570/
logsource:
  product: macos
  category: process_creation
detection:
  selection_process:
    Image|endswith:
    - /scp
    - /rsync
    - /sftp
  condition: selection_process
falsepositives:
- Legitimate system administration and backup operations
- Automated file synchronization tasks
- Development workflows using rsync for deployments
fields:
- Image
- CommandLine
- ProcessId
- ParentProcessId
- User
tags:
- attack.lateral-movement
- attack.t1021.004
- attack.t1570
level: medium
custom:
  coresigma:
    status: verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: fires
      logscale: fires
      kusto: converts
      defend: converts
      jamf-protect: not-verified
