title: macOS Screen Sharing Session
id: 1684f3e3-d701-477f-be1b-7169dba38f91
status: experimental
description: 'Detects screen sharing session attachment and detachment events. Screen
  sharing

  can be used for legitimate remote administration or by attackers for initial

  access and lateral movement. Monitor for unexpected or unauthorized sessions.

  '
author: Eric Brown - Nebulock, Inc.
date: 2025-10-31
modified: 2026-11-11
references:
- https://attack.mitre.org/techniques/T1021/005/
- https://attack.mitre.org/techniques/T1563/
logsource:
  product: macos
  category: screen_sharing
detection:
  selection:
    # every ESF event has an acting process: the category does the scoping
    Image|startswith: /
  condition: selection
falsepositives:
- Legitimate IT support and remote administration
- User-initiated screen sharing for collaboration
- Automated management tools
fields:
- User
tags:
- attack.initial-access
- attack.t1021.005
- attack.lateral-movement
- attack.t1563
level: medium
custom:
  coresigma:
    status: not-verified
    verdict:
      elastic-eql: silent
      elastic-esql: silent
      opensearch: silent
      splunk: silent
      clickhouse: silent
      logscale: fails
      kusto: fails
      defend: converts
      jamf-protect: not-verified
