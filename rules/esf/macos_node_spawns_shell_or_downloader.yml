title: Node or Bun Starts osascript, curl or a Fetching Shell
id: 3da590d3-6c09-4b25-992c-58dff3a069ec
name: node_npm_spawns_shell
status: experimental
description: |
  Detects node, bun or deno starting osascript, curl or wget, or a shell whose command line
  downloads or decodes something. npm install-time droppers (the Axios compromise, MiniRAT,
  GhostClaw, Mini Shai-Hulud) run this way from a postinstall hook. npm runs every lifecycle script
  through a shell, so a bare shell child is left out. Only the direct parent is checked: the taxonomy
  has no ancestor field, so a payload started two shells down is missed. Base rule for the
  package-manager persistence correlation.
references:
  - https://www.huntress.com/blog/supply-chain-compromise-axios-npm-package
  - https://www.stepsecurity.io/blog/mini-shai-hulud-is-back-a-self-spreading-supply-chain-attack-hits-the-npm-ecosystem
author: Eric Brown - Nebulock, Inc.
date: 2026-11-11
logsource:
  product: macos
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - /node
      - /bun
      - /deno
  selection_child_tool:
    Image|endswith:
      - /osascript
      - /curl
      - /wget
  selection_child_shell:
    Image:
      - /bin/sh
      - /bin/bash
      - /bin/zsh
      - /bin/dash
  selection_shell_fetch:
    CommandLine|contains:
      - 'curl '
      - 'wget '
      - osascript
      - base64 -d
      - base64 -D  # macOS spelling; listed for case-sensitive backends
      - base64 --decode
  condition: selection_parent and (selection_child_tool or (selection_child_shell and selection_shell_fetch))
falsepositives:
  - Package install scripts that download a prebuilt binary with curl
  - Development tooling that calls curl or osascript from a node script
tags:
  - attack.initial-access
  - attack.t1195.002
  - attack.execution
  - attack.t1059.004
level: medium
custom:
  coresigma:
    status: base
    base_of:
      - package_manager_persistence
