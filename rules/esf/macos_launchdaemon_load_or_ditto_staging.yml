title: LaunchDaemon Loaded or Data Zipped with Ditto (Stealer Pattern)
id: 3ad365c4-f3b5-401c-ae2f-7bfa048fefd9
name: launch_persistence_or_ditto_staging
status: experimental
description: |
  Base rule for the paste-to-stealer correlation, matching its last step as a process start:
  launchctl loading a plist from /Library/LaunchDaemons, or ditto zipping data in a temporary
  directory. A Sigma rule has one log source, so the plist creation and the Background Task
  Management registration are left to their own rules.
references:
  - https://unit42.paloaltonetworks.com/atomic-macos-amos-stealer-activity
author: Eric Brown - Nebulock, Inc.
date: 2026-11-11
logsource:
  product: macos
  category: process_creation
detection:
  selection_launchctl:
    - Image: /bin/launchctl
    - SigningID: com.apple.xpc.launchctl
  selection_load:
    CommandLine|contains:
      - ' load '
      - ' bootstrap '
  selection_daemon_plist:
    CommandLine|contains: ' /Library/LaunchDaemons/'
  selection_ditto:
    - Image: /usr/bin/ditto
    - SigningID: com.apple.ditto
  # -c and -k as separate or combined flags (-ck, -kc); --keepParent and the like don't count
  selection_archive_create:
    CommandLine|re: '.* -[a-zA-Z]*c[a-zA-Z]* .*'
  selection_archive_zip:
    CommandLine|re: '.* -[a-zA-Z]*k[a-zA-Z]* .*'
  selection_temp:
    CommandLine|contains:
      - ' /tmp/'
      - ' /private/tmp/'
      - ' /var/folders/'
      - ' /private/var/folders/'
  condition: (selection_launchctl and selection_load and selection_daemon_plist) or (selection_ditto and all of selection_archive_* and selection_temp)
falsepositives:
  - Software installers loading their own daemon
  - Scripts that zip files in /tmp
tags:
  - attack.persistence
  - attack.t1543.004
  - attack.collection
  - attack.t1560.001
level: low
custom:
  coresigma:
    status: base
    base_of:
      - paste_to_stealer
