title: Node or Bun Opens a Credential File
id: 72dfcfd7-5ceb-48c6-8d43-3e57a184b3b8
name: credential_file_access
status: experimental
description: |
  Detects node, bun or deno opening a credential file: AWS keys, SSH private keys, npm, GitHub CLI,
  Docker and git credentials, .netrc, a kubeconfig or gcloud application-default credentials. Base
  rule for the credential-path fan-out correlation, which alerts when one process opens three or more
  different ones within five minutes, as npm credential worms (Mini Shai-Hulud) do. The coreSigma ESF
  collector keeps opens only under ~/.aws and ~/.ssh, so in live collection only those count.
references:
  - https://www.stepsecurity.io/blog/mini-shai-hulud-is-back-a-self-spreading-supply-chain-attack-hits-the-npm-ecosystem
  - https://attack.mitre.org/techniques/T1552/001/
author: Eric Brown - Nebulock, Inc.
date: 2026-11-11
logsource:
  product: macos
  category: file_access
detection:
  selection_runtime:
    Image|endswith:
      - /node
      - /bun
      - /deno
  selection_credential_file:
    TargetFilename|endswith:
      - /.aws/credentials
      - /.npmrc
      - /.config/gh/hosts.yml
      - /.docker/config.json
      - /.git-credentials
      - /.netrc
      - /.kube/config
      - /.config/gcloud/application_default_credentials.json
  selection_ssh_key:
    TargetFilename|contains: /.ssh/id_
  filter_public_key:
    TargetFilename|endswith: .pub
  condition: selection_runtime and (selection_credential_file or (selection_ssh_key and not filter_public_key))
falsepositives:
  - npm reads .npmrc and the AWS SDK reads ~/.aws/credentials; one process doing both is still below the fan-out threshold
  - Node deployment CLIs that read several cloud credentials on purpose
tags:
  - attack.credential-access
  - attack.t1552.001
  - attack.t1552.004
level: low
custom:
  coresigma:
    status: base
    base_of:
      - credential_path_fanout
