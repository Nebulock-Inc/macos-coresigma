title: macOS SSH Connection Detection
id: 336e30d8-4ced-44db-8c78-abb0b1ad13bb
status: experimental
description: 'Detects execution of SSH client or SSH daemon processes which may indicate

  initial access attempts or remote connections. Monitor for unauthorized SSH

  connections, especially from unexpected users or to sensitive systems.

  '
author: Eric Brown - Nebulock, Inc.
date: 2025-10-31
modified: 2026-11-11
references:
- https://attack.mitre.org/techniques/T1078/
- https://attack.mitre.org/techniques/T1021/004/
logsource:
  product: macos
  category: process_creation
detection:
  selection_process:
    Image|endswith:
    - /ssh
    - /sshd
    - /sshd-session
  # sshd -t / -T only tests or prints the configuration and exits: no connection (ssh -t is the client's tty flag)
  filter_sshd_config_test_last:
    Image|endswith: /sshd
    CommandLine|endswith:
    - ' -t'
    - ' -T'
  filter_sshd_config_test_flag:
    Image|endswith: /sshd
    CommandLine|contains:
    - ' -t '
    - ' -T '
  condition: selection_process and not 1 of filter_sshd_config_test_*
falsepositives:
- Legitimate SSH usage by administrators
- Automated scripts using SSH for remote management
- CI/CD pipelines using SSH for deployments
fields:
- Image
- CommandLine
- ProcessId
- ParentProcessId
- User
tags:
- attack.initial-access
- attack.t1078
- attack.lateral-movement
- attack.t1021.004
level: medium
custom:
  coresigma:
    status: verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: fires
      logscale: fires
      kusto: converts
      defend: converts
      jamf-protect: not-verified
