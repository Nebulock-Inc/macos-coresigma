title: Local Password Checked with dscl -authonly
id: f17b8162-749c-4058-a61a-81efcf529120
status: experimental
description: |
  Detects dscl -authonly, which checks a user's password against the local directory without
  logging in. AMOS-lineage stealers run it in a loop to confirm the password a fake prompt captured
  before using it on the keychain. The matched command line contains the password in clear text, so
  treat these events as sensitive.
references:
  - https://unit42.paloaltonetworks.com/atomic-macos-amos-stealer-activity
  - https://attack.mitre.org/techniques/T1056/002/
author: Eric Brown - Nebulock, Inc.
date: 2026-11-11
logsource:
  product: macos
  category: process_creation
detection:
  selection_dscl_path:
    Image: /usr/bin/dscl
  selection_dscl_signed:
    SigningID: com.apple.dscl
  selection_authonly:  # dscl's leading dashes are optional: dscl . authonly is the same command
    CommandLine|contains:
    - ' -authonly '
    - ' authonly '
  condition: 1 of selection_dscl_* and selection_authonly
falsepositives:
  - MDM or admin scripts that verify a password before enabling FileVault or granting a secure token
tags:
  - attack.credential-access
  - attack.t1056.002
level: high
custom:
  coresigma:
    status: verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: fires
      logscale: fails
      kusto: fails
      defend: converts
      jamf-protect: not-verified
