title: XPC Connection from Unusual Location
id: 4fdd0c51-2354-414b-b74d-45b634d0fcb4
status: experimental
description: Detects XPC service connections initiated from unusual file system locations
references:
- https://attack.mitre.org/techniques/T1559/
author: Eric Brown - Nebulock, Inc.
date: 2025-10-29
tags:
- attack.execution
- attack.t1559
logsource:
  product: macos
  category: xpc_connection
detection:
  selection:
    Image|startswith:
    - /tmp/
    - /var/tmp/
    - /private/tmp/
    - /private/var/tmp/
    - /Users/Shared/
    - /dev/shm/
  condition: selection
falsepositives:
- Installers running from temporary locations
- User scripts
level: medium
modified: 2026-11-11
custom:
  coresigma:
    status: verified
    verdict:
      elastic-eql: fires
      elastic-esql: fires
      opensearch: fires
      splunk: fires
      clickhouse: fires
      logscale: fails
      kusto: fails
      defend: converts
      jamf-protect: not-verified
