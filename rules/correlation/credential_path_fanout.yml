title: Credential File Fan-Out by Node or Bun
id: ed392fa9-cb5c-441d-9ecd-63f446b44a7c
status: experimental
description: |
  Detects one node, bun or deno process opening three or more different credential files within five
  minutes, the harvest step of npm credential worms such as Mini Shai-Hulud.
references:
  - https://www.stepsecurity.io/blog/mini-shai-hulud-is-back-a-self-spreading-supply-chain-attack-hits-the-npm-ecosystem
author: Eric Brown - Nebulock, Inc.
date: 2026-11-11
tags:
  - attack.credential-access
  - attack.t1552.001
  - attack.t1552.004
correlation:
  type: value_count
  rules:
    - credential_file_access
  group-by:
    - host.name
    - process.pid
  timespan: 5m
  condition:
    field: file.path
    gte: 3
  generate: false
custom:
  coresigma:
    status: verified
    verdict:
      elastic-eql: fails
      elastic-esql: fires
      opensearch: fails
      splunk: fires
      clickhouse: fires
      logscale: fails
      kusto: fails
      defend: fails
      jamf-protect: not-verified
    logscale: unsupported  # pysigma-backend-crowdstrike 3.0.0 has no correlation support
falsepositives:
  - Node deployment or credential-management CLIs that read several credentials on purpose
level: high
