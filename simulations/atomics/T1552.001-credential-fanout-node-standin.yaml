attack_technique: T1552.001
display_name: "Unsecured Credentials: Credentials In Files"
atomic_tests:
  - name: Credential File Reads by a node Stand-in (2026 macOS)
    description: |
      Simulates the harvest step of npm credential worms: one process named node opens four credential-named files (.aws/credentials and three .ssh/id_* keys) under a throwaway home directory.

      Fidelity limits:
      - `node` is a cc-compiled stub (ad-hoc, linker-signed) that only reads the files named on its command line
      - The files are dummies under /tmp/cs_sim_fanout/home; the real home directory is never read

      Expected telemetry: cc/ld execs, the stub's exec, and four ESF open events from it, one per file.

      Falcon block status: not blocked (2026-11-12 22:06Z run; macOS 26.7, Falcon 8.10)

      Prerequisite: Xcode Command Line Tools (`cc`). The Amazon macOS AMI has them; MacStadium images don't.
    supported_platforms:
      - macos
    executor:
      name: bash
      elevation_required: false
      command: |
        set -e
        xcode-select -p >/dev/null 2>&1 || { echo "prereq missing: Xcode Command Line Tools (cc)"; exit 1; }
        D=/tmp/cs_sim_fanout; H="$D/home"
        rm -rf "$D" && mkdir -p "$D/bin" "$H/.aws" "$H/.ssh"
        printf '[default]\n# coresigma simulation dummy, not a credential\n' > "$H/.aws/credentials"
        for k in id_rsa id_ed25519 id_ecdsa; do printf 'coresigma simulation dummy, not a key\n' > "$H/.ssh/$k"; done
        printf '%s\n' '#include <stdio.h>' 'int main(int argc, char **argv) {' '  char b[256];' '  for (int i = 1; i < argc; i++) { FILE *f = fopen(argv[i], "r"); if (!f) continue; while (fread(b, 1, sizeof b, f) > 0) {} fclose(f); }' '  return 0;' '}' > "$D/node.c"
        cc -o "$D/bin/node" "$D/node.c"
        "$D/bin/node" "$H/.aws/credentials" "$H/.ssh/id_rsa" "$H/.ssh/id_ed25519" "$H/.ssh/id_ecdsa"
        echo "Credential fan-out complete"
      cleanup_command: |
        set -e
        rm -rf /tmp/cs_sim_fanout
        echo "Cleanup complete"
