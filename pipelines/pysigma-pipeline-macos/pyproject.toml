[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pysigma-pipeline-macos"
version = "0.1.0"
description = "pySigma macOS detection pipeline"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pysigma>=1.0.2,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sigma*"]
